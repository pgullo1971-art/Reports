<title>Daily text</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  /* Layout: one centered card holding today's date and a single large button that tries JW Library, then falls back to wol.jw.org. */
  :root {
    --bg: #eef2f5;
    --card: #ffffff;
    --fg: #1d2a33;
    --muted: #5b6b77;
    --line: #d5dde3;
    --accent: #2f5d7c;
    --accent-hover: #244a63;
    --on-accent: #ffffff;
    --display: "Literata", Georgia, "Times New Roman", serif;
    --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11181d; --card: #1a242b; --fg: #e4ebef; --muted: #9aabb6;
      --line: #2b3943; --accent: #7fb2d4; --accent-hover: #9cc5e0; --on-accent: #0e1a22;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11181d; --card: #1a242b; --fg: #e4ebef; --muted: #9aabb6;
    --line: #2b3943; --accent: #7fb2d4; --accent-hover: #9cc5e0; --on-accent: #0e1a22;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px;
    box-sizing: border-box;
  }
  .card {
    width: 100%;
    max-width: 26rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2rem 1.75rem;
    display: grid;
    gap: 1.25rem;
    text-align: center;
    box-sizing: border-box;
  }
  .eyebrow {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.9rem;
    line-height: 1.2;
    text-wrap: balance;
  }
  .btn {
    display: block;
    padding: 1rem 1.25rem;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font-family: var(--body);
    font-size: 1.1rem;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.15s ease;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible, .alt:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .note {
    margin: 0;
    font-size: 0.875rem;
    color: var(--muted);
  }
  .alt {
    color: var(--accent);
    font-size: 0.9rem;
    font-weight: 600;
  }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<main class="card">
  <p class="eyebrow">Examining the Scriptures Daily</p>
  <h1 id="today">Today</h1>
  <a id="go" class="btn" href="https://wol.jw.org/en/wol/h/r1/lp-e">Daily text</a>
  <p class="note" id="note" role="status">Opens in JW Library. If the app isn't on this device, it opens on wol.jw.org instead.</p>
  <a id="alt" class="alt" href="https://wol.jw.org/en/wol/h/r1/lp-e" target="_blank" rel="noopener">Read on wol.jw.org instead</a>
</main>

<script>
  // The button tries JW Library first (its app link for the daily text). A web page can't
  // check whether an app is installed, so if this page is still in front ~2 s after the
  // tap, the app didn't open: the button then becomes a wol.jw.org link. That outcome is
  // remembered on this device, with a small link to try the app again.
  const KEY = "daily-text-app-missing";
  const go = document.getElementById("go");
  const alt = document.getElementById("alt");
  const note = document.getElementById("note");
  let appMissing = false;
  try { appMissing = localStorage.getItem(KEY) === "1"; } catch {}

  function links() {
    const d = new Date();
    const y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    const ymd = String(y) + String(m).padStart(2, "0") + String(day).padStart(2, "0");
    return {
      app: "jwlibrary:///finder?srcid=jwlshare&wtlocale=E&prefer=lang&alias=daily-text&date=" + ymd,
      web: "https://wol.jw.org/en/wol/dt/r1/lp-e/" + y + "/" + m + "/" + day,
      label: d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" })
    };
  }

  function update() {
    const l = links();
    document.getElementById("today").textContent = l.label;
    alt.href = l.web;
    if (appMissing) {
      go.href = l.web;
      go.target = "_blank";
      go.rel = "noopener";
      note.textContent = "Opens on wol.jw.org. JW Library didn't open on this device last time.";
      alt.textContent = "Try JW Library again";
      alt.removeAttribute("target");
    } else {
      go.href = l.app;
      go.removeAttribute("target");
      note.textContent = "Opens in JW Library. If the app isn't on this device, it opens on wol.jw.org instead.";
      alt.textContent = "Read on wol.jw.org instead";
      alt.target = "_blank";
    }
  }

  let timer = 0;
  function appOpened() { clearTimeout(timer); timer = 0; }
  window.addEventListener("blur", appOpened);
  window.addEventListener("pagehide", appOpened);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) appOpened(); else update();
  });

  go.addEventListener("click", () => {
    if (appMissing) return; // plain wol.jw.org link
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = 0;
      appMissing = true;
      try { localStorage.setItem(KEY, "1"); } catch {}
      update();
      note.textContent = "JW Library didn't open, so here's the text on wol.jw.org. Tap the button.";
      go.focus();
    }, 2000);
  });

  alt.addEventListener("click", (e) => {
    if (!appMissing) return; // plain wol.jw.org link
    e.preventDefault();
    appMissing = false;
    try { localStorage.removeItem(KEY); } catch {}
    update();
    go.click();
  });

  update();
</script>
